# OSS Close-UP 개발 환경
#   docker compose up -d --build   → db, backend, worker 기동
#   curl http://localhost:8000/health
#   docker compose exec worker /app/run_sample_scan.sh   → 샘플 검사

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?.env에 POSTGRES_USER 필요}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env에 POSTGRES_PASSWORD 필요}
      POSTGRES_DB: ${POSTGRES_DB:?.env에 POSTGRES_DB 필요}
    volumes:
      - pgdata:/var/lib/postgresql/data      # 컨테이너를 지워도 데이터 유지
    # 포트를 PC에 열지 않음: backend는 도커 내부망으로 접속하고,
    # 직접 볼 때는 `docker compose exec db psql ...` 사용
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      SCAN_STORAGE_ROOT: /work/uploads
      SCAN_RESULTS_ROOT: /work/results    # SBOM 다운로드용 (읽기 전용)
      UPLOAD_RETENTION_SECONDS: "0"          # 검사가 끝나면 업로드 원본을 바로 삭제(소개서 3.10)
      UPLOAD_CLEANUP_INTERVAL_SECONDS: "60"   # 정리 주기. 0이면 자동 정리 끔
      # GITHUB_TOKEN은 backend에 주지 않음 (검사를 하는 worker에만 3단계에서 전달)
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - scan-uploads:/work/uploads
      - ./results:/work/results:ro         # worker가 쓴 결과를 읽기만 함
    ports:
      - "127.0.0.1:8000:8000"

  worker:
    build: ./worker
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}        # GitHub 조회는 worker만 함
      SCAN_STORAGE_ROOT: /work/uploads
      SCAN_RESULTS_ROOT: /work/results
      SCAN_TOOL_TIMEOUT_SECONDS: "660"
      TRIVY_CACHE_DIR: /cache/trivy
      VULN_DB_REFRESH_SECONDS: "86400"      # Trivy 취약점 DB는 하루에 한 번만 새로 받음
      MAINTENANCE_WORKERS: "8"              # npm·GitHub 조회 동시 개수
    volumes:
      - scan-uploads:/work/uploads:ro
      - trivy-cache:/cache/trivy             # Trivy 취약점 DB 캐시 (매번 다시 받지 않게)
      - ./samples:/work/samples:ro           # 샘플 입력 (읽기 전용)
      - ./results:/work/results              # 검사 결과 저장 (PC의 results 폴더)
    depends_on:
      db:
        condition: service_healthy
    # 포트 없음: worker는 외부에서 접속할 일이 없음

volumes:
  pgdata:
  trivy-cache:
  scan-uploads:
